name: Vexor CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: CLI Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y nmap libssl-dev libffi-dev libxml2-dev libxslt1-dev

    - name: Upgrade pip
      run: pip install --upgrade pip setuptools wheel

    - name: Install Vexor CLI
      run: |
        cd cli
        pip install -e .
        pip install pytest pytest-asyncio
        # Verify installation
        python -c "import vexor; print('Package installed at:', vexor.__file__)"
        python -c "import pkgutil; pkgs = [p.name for p in pkgutil.walk_packages(path=['vexor'], prefix='vexor.')]; print('Subpackages:', [p for p in pkgs if 'report' in p or 'module' in p])"

    - name: Test imports
      run: |
        cd cli
        python -c "import vexor; print('✓ vexor OK')"
        python -c "from vexor.config import TOOL_VERSION; print(f'✓ version {TOOL_VERSION}')"
        python -c "from vexor.modules.sqli import Scanner; print('✓ sqli OK')"
        python -c "from vexor.modules.xss import Scanner; print('✓ xss OK')"
        python -c "from vexor.modules.headers import Scanner; print('✓ headers OK')"
        python -c "from vexor.modules.cors import Scanner; print('✓ cors OK')"
        python -c "from vexor.modules.ssl_analyzer import Scanner; print('✓ ssl OK')"
        python -c "from vexor.modules.jwt_analyzer import Scanner; print('✓ jwt OK')"
        python -c "from vexor.modules.sensitive_data import Scanner; print('✓ sensitive_data OK')"
        python -c "from vexor.tui.app import VexorApp; print('✓ TUI OK')"
        python -c "from vexor.ai.client import AIClient; print('✓ AI client OK')"
        python -c "from vexor.reports.html import HTMLReport; print('✓ reports OK')"
        python -c "from vexor.core.decoder import Decoder; print('✓ decoder OK')"
        python -c "from vexor.plugins.manager import PluginManager; print('✓ plugins OK')"

    - name: Test CLI entry point
      run: |
        cd cli
        python -m vexor.main --version

    - name: Run tests (if any)
      run: |
        cd cli
        pytest tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install ruff
      run: pip install ruff
    - name: Lint (non-blocking)
      run: ruff check cli/vexor/ --ignore E501,F401,F811 || true
