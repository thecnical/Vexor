name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build package
      run: |
        cd cli
        pip install build
        python -m build

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: cli/dist/*
        body: |
          ## Vexor ${{ github.ref_name }}

          AI-Powered CLI Security Toolkit

          ### Install
          ```bash
          git clone https://github.com/thecnical/Vexor
          cd Vexor
          chmod +x install.sh
          ./install.sh
          ```

          Created by Chandan Pandey (Technical)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
