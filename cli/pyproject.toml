[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vexor"
version = "1.0.0"
description = "AI-Powered CLI Security Toolkit"
authors = [
    {name = "Chandan Pandey (Technical)", email = "chandan@vexor.security"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["security", "pentesting", "hacking", "cli", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # CLI & UI
    "typer>=0.12.0",
    "rich>=13.0.0",
    "textual>=0.60.0",

    # HTTP & Networking
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "websockets>=12.0",

    # HTML/XML Parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",

    # Security & Crypto
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "pyOpenSSL>=24.0.0",

    # Data & Config
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",

    # DNS & Network
    "dnspython>=2.6.0",

    # Storage
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",

    # Reports
    "markdown>=3.6",
]

[project.optional-dependencies]
all = [
    "scapy>=2.5.0",
    "mitmproxy>=10.0.0",
    "python-nmap>=0.7.1",
    "weasyprint>=62.0",
    "playwright>=1.40.0",
]

[project.scripts]
vexor = "vexor.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["vexor*"]

[tool.setuptools.package-data]
"vexor" = ["payloads/*.txt"]
"vexor.payloads" = ["*.txt"]
"vexor.reports" = ["templates/*", "*.py"]
